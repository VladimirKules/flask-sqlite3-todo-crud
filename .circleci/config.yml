version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - run:
          name: Установка зависимостей
          command: |
            pip install --user flask flask_sqlalchemy
      - run:
          name: Запуск тестов
          command: |
            python -c "import app; print('Тест пройден: модуль app загружен')"
            python -c "import flask; import flask_sqlalchemy; print('Тест пройден: зависимости установлены')"

  build:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.14  # Убедитесь, что версия указана корректно
          docker_layer_caching: true  # Опционально: ускоряет сборку
      - run:
          name: Проверка Docker
          command: docker --version  # Добавьте проверку Docker
      - run:
          name: Сборка Docker-образа
          command: |
            ls -la  # Проверьте, что Dockerfile существует
            docker build -t flask-todo-app:latest .
            docker images  # Проверьте, что образ создался
      - run:
          name: Проверка сборки
          command: |
            docker run --rm flask-todo-app:latest python -c "import flask; print('Flask version:', flask.__version__)"

workflows:
  version: 2
  test_and_build:
    jobs:
      - test
      - build:
          requires:
            - test