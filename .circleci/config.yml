version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - run:
          name: Установка зависимостей
          command: |
            pip install --user flask flask_sqlalchemy
      - run:
          name: Запуск тестов
          command: |
            python -c "import app; print('Тест пройден: модуль app загружен')"
            python -c "import flask; import flask_sqlalchemy; print('Тест пройден: зависимости установлены')"

  build:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - setup_remote_docker  # Убрал указание версии - CircleCI выберет сам
      - run:
          name: Проверка Docker
          command: docker --version
      - run:
          name: Сборка Docker-образа
          command: |
            docker build -t flask-todo-app:latest .
            echo "✅ Docker-образ успешно собран"
      - run:
          name: Проверка образа
          command: |
            docker images | grep flask-todo-app

workflows:
  version: 2
  test_and_build:
    jobs:
      - test
      - build:
          requires:
            - test